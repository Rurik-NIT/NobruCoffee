name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nobru
          POSTGRES_PASSWORD: nobru
          POSTGRES_DB: nobru_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nobru"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://nobru:nobru@localhost:5432/nobru_ci?schema=public
      AUTH_SECRET: ci-secret-nao-usar-em-producao-0000000000000000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Schema
        run: pnpm db:push

      - name: Seed
        run: pnpm db:seed

      - name: Tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
