# Banco de desenvolvimento local. Produção usa um Postgres gerenciado.
services:
  db:
    image: postgres:16-alpine
    container_name: nobru-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nobru
      POSTGRES_PASSWORD: nobru
      POSTGRES_DB: nobru
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - '5432:5432'
    volumes:
      - nobru-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nobru -d nobru']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  nobru-pgdata:
